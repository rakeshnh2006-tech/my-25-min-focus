<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo-256.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    
    <!-- Theme & Mobile App Configuration -->
    <meta name="theme-color" content="#070B16" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070B16" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#070B16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cognify" />
    <link rel="manifest" href="/manifest.json" />

    <title>Cognify — Focus deeper. Learn smarter.</title>
    <meta name="description" content="Cognify — A calmer workspace for deeper focus, better study sessions, and consistent progress." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Instant Pre-Hydration Stylesheet (Ensures zero white-flash and smooth layout before JS loads) -->
    <style>
      html, body {
        background-color: #070B16 !important;
        color: #F8FAFC !important;
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: #070B16;
      }

      /* Native hardware-accelerated animations for preloader */
      @keyframes preloaderPulse {
        0%, 100% { transform: scale(1); opacity: 0.55; }
        50% { transform: scale(1.08); opacity: 0.9; }
      }

      @keyframes preloaderShimmer {
        0% { transform: translateX(-100%); }
        60% { transform: translateX(110%); }
        100% { transform: translateX(110%); }
      }

      @keyframes preloaderFadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .preload-container {
        min-height: 100vh;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        box-sizing: border-box;
        position: relative;
        overflow: hidden;
        background-color: #070B16;
        animation: preloaderFadeIn 0.35s ease-out;
      }

      .preload-orb-1 {
        position: absolute;
        top: 25%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(450px, 85vw);
        height: min(450px, 85vw);
        background: radial-gradient(circle, rgba(59, 130, 246, 0.16) 0%, rgba(99, 102, 241, 0.08) 45%, transparent 70%);
        border-radius: 50%;
        filter: blur(50px);
        pointer-events: none;
      }

      .preload-badge {
        position: relative;
        width: 76px;
        height: 76px;
        margin-bottom: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .preload-glow {
        position: absolute;
        inset: -6px;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.45) 0%, rgba(99, 102, 241, 0.25) 60%, transparent 80%);
        border-radius: 28px;
        filter: blur(14px);
        animation: preloaderPulse 2.4s infinite ease-in-out;
      }

      .preload-card {
        position: relative;
        width: 76px;
        height: 76px;
        border-radius: 22px;
        overflow: hidden;
        background: #0A1020;
        border: 1.5px solid rgba(96, 165, 250, 0.35);
        box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.85), inset 0 1.5px 1px rgba(255, 255, 255, 0.18);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .preload-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .preload-title {
        margin: 0 0 6px 0;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.025em;
        color: #FFFFFF;
      }

      .preload-subtitle {
        margin: 0 0 24px 0;
        font-size: 13px;
        font-weight: 500;
        color: #94A3B8;
        letter-spacing: 0.01em;
      }

      .preload-bar-track {
        width: min(220px, 75vw);
        height: 5px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6);
      }

      .preload-bar-fill {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 55%;
        background: linear-gradient(90deg, #3B82F6, #6366F1, #10B981);
        border-radius: 9999px;
        box-shadow: 0 0 12px rgba(59, 130, 246, 0.6);
        animation: preloaderShimmer 1.5s infinite ease-in-out;
      }

      .preload-status {
        margin-top: 14px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #64748B;
      }
    </style>
  </head>
  <body class="bg-[#070B16] text-[#F8FAFC] min-h-screen font-sans antialiased selection:bg-focus-500 selection:text-white overflow-x-hidden">
    <div id="root">
      <!-- Pre-hydration Shell: Instant paint on both desktop and mobile -->
      <div class="preload-container">
        <div class="preload-orb-1"></div>
        <div class="preload-badge">
          <div class="preload-glow"></div>
          <div class="preload-card">
            <img src="/logo-256.png" alt="Cognify" />
          </div>
        </div>
        <h1 class="preload-title">Cognify</h1>
        <p class="preload-subtitle">Focus deeper. Learn smarter.</p>
        <div class="preload-bar-track">
          <div class="preload-bar-fill"></div>
        </div>
        <div class="preload-status">Starting workspace...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
